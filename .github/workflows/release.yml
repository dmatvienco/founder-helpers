name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run build
      # NPM_TOKEN repo secret must exist before the first release (milestone M6).
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Runs after npm publish on purpose: npm is the artifact that matters, so
      # a failure here must never be able to stop or precede the publish.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping (re-pushed tag)"
            exit 0
          fi
          NOTES_FILE="$(mktemp)"
          if node scripts/changelog-section.mjs "$VERSION" > "$NOTES_FILE"; then
            gh release create "$GITHUB_REF_NAME" --title "Version $VERSION" --notes-file "$NOTES_FILE"
          else
            echo "No CHANGELOG.md section for $VERSION, falling back to --generate-notes"
            gh release create "$GITHUB_REF_NAME" --title "Version $VERSION" --generate-notes
          fi
